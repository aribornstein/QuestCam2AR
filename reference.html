<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR Camera to Texture Demo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      z-index: 100;
    }

    #enterVR {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 16px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }

    #enterVR:hover {
      background: #1976D2;
    }
  </style>
</head>

<body>
  <div id="info">
    WebXR Camera Feed Demo<br>
    Select a camera and enter VR to see it displayed
  </div>
  <div id="controls"
    style="position: absolute; top: 60px; left: 10px; background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 5px; color: white;">
    <label for="cameraSelect">Camera: </label>
    <select id="cameraSelect" style="margin-bottom: 10px;">
      <option value="">Loading cameras...</option>
    </select>
  </div>
  <video id="cameraVideo" style="position: absolute; bottom: 10px; right: 10px; width: 320px; border: 2px solid white;"
    autoplay playsinline></video>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    let camera, scene, renderer;
    let displayMesh, videoTexture, frame;
    let video, cameraSelect;
    let currentStream = null;
    let controller1, controller2;
    let controllerGrip1, controllerGrip2;
    let headLockedGroup;
    let cameraSettings = null;

    init();

    async function init() {
      video = document.getElementById('cameraVideo');
      cameraSelect = document.getElementById('cameraSelect');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 1.6, 3);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
      light.position.set(0, 20, 0);
      scene.add(light);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(3, 10, 10);
      scene.add(dirLight);

      videoTexture = new THREE.VideoTexture(video);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format = THREE.RGBAFormat;
      videoTexture.flipY = false;

      headLockedGroup = new THREE.Group();

      const planeGeometry = new THREE.PlaneGeometry(3, 2);
      const planeMaterial = new THREE.MeshBasicMaterial({
        map: videoTexture,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
      });
      displayMesh = new THREE.Mesh(planeGeometry, planeMaterial);
      displayMesh.position.set(-0.031826, -0.0176365, -1.5 - 0.0632489);
      displayMesh.quaternion.set(-0.99529, 0.003655133, -0.00312916, 0.09676389);
      headLockedGroup.add(displayMesh);

      const frameGeometry = new THREE.PlaneGeometry(3.1, 2.1);
      const frameMaterial = new THREE.MeshBasicMaterial({
        color: 0x333333,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8
      });
      frame = new THREE.Mesh(frameGeometry, frameMaterial);
      frame.position.set(0, 0, -1.51);
      frame.rotation.y = Math.PI;
      headLockedGroup.add(frame);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const arButton = ARButton.createButton(renderer, {
        optionalFeatures: ['hand-tracking']
      });
      document.body.appendChild(arButton);

      setupControllers();

      window.addEventListener('resize', onWindowResize);

      await setupCameraList();

      cameraSelect.addEventListener('change', async () => {
        const deviceId = cameraSelect.value;
        if (deviceId && renderer.xr.isPresenting) {
          await startCamera(deviceId);
        }
      });

      renderer.xr.addEventListener('sessionstart', async () => {
        console.log('XR session started, initializing camera feed');

        scene.add(headLockedGroup);
        console.log('Head-locked group added to scene');
        console.log('Head-locked group children:', headLockedGroup.children);

        const deviceId = cameraSelect.value;
        if (deviceId) {
          await startCamera(deviceId);
        } else {
          console.warn('No camera device selected');
        }
      });

      renderer.xr.addEventListener('sessionend', () => {
        console.log('XR session ended, stopping camera feed');

        scene.remove(headLockedGroup);

        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
          currentStream = null;
        }
      });

      animate();
    }

    function setupControllers() {
      const controllerModelFactory = new XRControllerModelFactory();

      controller1 = renderer.xr.getController(0);
      controller1.addEventListener('selectstart', onSelectStart);
      controller1.addEventListener('selectend', onSelectEnd);
      scene.add(controller1);

      controller2 = renderer.xr.getController(1);
      controller2.addEventListener('selectstart', onSelectStart);
      controller2.addEventListener('selectend', onSelectEnd);
      scene.add(controller2);

      controllerGrip1 = renderer.xr.getControllerGrip(0);
      controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
      scene.add(controllerGrip1);

      controllerGrip2 = renderer.xr.getControllerGrip(1);
      controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
      scene.add(controllerGrip2);

      const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -1)
      ]);

      const line = new THREE.Line(geometry);
      line.name = 'line';
      line.scale.z = 5;

      controller1.add(line.clone());
      controller2.add(line.clone());
    }

    function onSelectStart(event) {
      const controller = event.target;
      controller.userData.isSelecting = true;
    }

    function onSelectEnd(event) {
      const controller = event.target;
      controller.userData.isSelecting = false;
    }

    async function setupCameraList() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        const backFacingKeywords = ['back', 'rear', 'environment', 'world'];
        const backCameras = videoDevices.filter(device => {
          const label = device.label.toLowerCase();
          return backFacingKeywords.some(keyword => label.includes(keyword));
        });

        cameraSelect.innerHTML = '';

        if (backCameras.length === 0) {
          cameraSelect.innerHTML = '<option>No back-facing cameras found</option>';
          console.warn('No back-facing cameras detected');
          return;
        }

        backCameras.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Back Camera ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        if (backCameras.length >= 2) {
          cameraSelect.selectedIndex = 1;
          console.log('Default camera set to second camera');
        }

        console.log(`Found ${backCameras.length} back-facing camera(s)`);
      } catch (error) {
        console.error('Error accessing cameras:', error);
        cameraSelect.innerHTML = '<option>Error accessing cameras</option>';
      }
    }

    async function startCamera(deviceId) {
      console.log('Starting camera with device ID:', deviceId);

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            deviceId: { exact: deviceId },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        console.log('Requesting camera with constraints:', constraints);
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        console.log('Got camera stream:', currentStream);

        video.srcObject = currentStream;
        console.log('Set video srcObject');

        const videoTrack = currentStream.getVideoTracks()[0];
        cameraSettings = videoTrack.getSettings();
        console.log('Camera settings:', cameraSettings);

        await video.play();
        console.log('Video playing, readyState:', video.readyState);

        if (video.readyState >= 2) {
          console.log('Video metadata already loaded');
          updateVideoDisplay();
        } else {
          console.log('Waiting for video metadata...');
          await new Promise(resolve => {
            video.addEventListener('loadedmetadata', () => {
              console.log('Video metadata loaded');
              resolve();
            }, { once: true });
          });
          updateVideoDisplay();
        }
      } catch (error) {
        console.error('Error starting camera:', error);
      }
    }

    function updateVideoDisplay() {
      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;
      console.log('Video dimensions:', videoWidth, 'x', videoHeight);
      console.log('Video playing:', !video.paused);
      console.log('Video currentTime:', video.currentTime);

      if (renderer.xr.isPresenting) {
        const xrCamera = renderer.xr.getCamera();
        const leftEyeCamera = xrCamera.cameras[0];
        const projectionMatrix = leftEyeCamera.projectionMatrix;

        const fovHorizontal = 2 * Math.atan(1 / projectionMatrix.elements[0]);
        const fovVertical = 2 * Math.atan(1 / projectionMatrix.elements[5]);
        console.log('Left eye horizontal FOV (radians):', fovHorizontal);
        console.log('Left eye horizontal FOV (degrees):', fovHorizontal * 180 / Math.PI);
        console.log('Left eye vertical FOV (radians):', fovVertical);
        console.log('Left eye vertical FOV (degrees):', fovVertical * 180 / Math.PI);

        const distance = 1.5 + 0.0632489;
        const displayWidth = 2 * distance * Math.tan(fovHorizontal / 2);
        const displayHeight = 2 * distance * Math.tan(fovVertical / 2);

        console.log('Display dimensions:', displayWidth, 'x', displayHeight);

        displayMesh.geometry.dispose();
        displayMesh.geometry = new THREE.PlaneGeometry(displayWidth, displayHeight);

        console.log('DisplayMesh position:', displayMesh.position);
        console.log('DisplayMesh visible:', displayMesh.visible);
        console.log('VideoTexture:', videoTexture);

        const frameWidth = displayWidth + 0.1;
        const frameHeight = displayHeight + 0.1;
        if (frame) {
          frame.geometry.dispose();
          frame.geometry = new THREE.PlaneGeometry(frameWidth, frameHeight);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      if (renderer.xr.isPresenting) {
        const xrCamera = renderer.xr.getCamera();
        headLockedGroup.position.copy(xrCamera.position);
        headLockedGroup.quaternion.copy(xrCamera.quaternion);
      }

      renderer.render(scene, camera);
    }
  </script>
</body>

</html>
